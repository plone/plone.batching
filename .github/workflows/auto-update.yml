name: Automated update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: plone/meta/.github/actions/setup_uv@2.x
      - name: run plone.meta config-package
        run: uvx --from plone.meta config-package --branch=current --no-commit .
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: meta/update
          commit-message: "Update Configuration files with plone.meta"
          title: "[meta] Update configuration"
          body: "Changes generated by GitHub Actions."
